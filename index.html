<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2e6e9e">
<title>Sweet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:linear-gradient(180deg,#b8dff5 0%,#d8eefb 45%,#f3f8fd 100%);min-height:100vh;color:#2b4a66;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 8px}
#head .logo{font-size:19px;font-weight:800;letter-spacing:1px;color:#1d5a85}
#head .logo small{font-size:11px;font-weight:400;color:#5d86a8;margin-left:6px}
#head .love{font-size:14px}
#tabs{display:flex;gap:6px;padding:4px 14px 10px;overflow-x:auto}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:14px;cursor:pointer;font-size:13px;font-weight:600;color:#5d86a8;white-space:nowrap;background:rgba(255,255,255,0.5);transition:all .2s}
.tab.on{background:#2e6e9e;color:#fff;box-shadow:0 4px 14px rgba(46,110,158,.28)}
#body{padding:6px 14px 20px}
.card{background:rgba(255,255,255,0.66);border:1px solid rgba(255,255,255,0.8);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 6px 20px rgba(60,120,170,0.10)}
.lbl{font-size:13px;font-weight:700;margin-bottom:8px}
.sub{font-size:12px;color:#5d86a8;line-height:1.6;margin-bottom:10px}
input[type=text]{width:100%;padding:11px 12px;border:1.5px solid rgba(90,150,200,.35);border-radius:12px;background:#fff;color:#2b4a66;font-size:14px;outline:none;margin-bottom:8px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:14px;cursor:pointer;background:#2e6e9e;color:#fff;font-size:14px;font-weight:700;text-align:center;box-shadow:0 4px 14px rgba(46,110,158,.25)}
.btn.ghost{background:transparent;color:#2e6e9e;border:1.5px solid #2e6e9e;box-shadow:none}
input[type=range]{width:100%;accent-color:#2e6e9e;margin:8px 0}
.delay-txt{text-align:center;font-size:14px;font-weight:700;color:#2e6e9e;margin-bottom:8px}
.q-item{font-size:14px;font-weight:600;margin:10px 0 4px}
.q-opts{font-size:11px;color:#5d86a8;margin-bottom:4px}
.imgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.imgs img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.p-item{padding:12px;border:1px solid rgba(90,150,200,.3);border-radius:14px;margin-bottom:10px;background:#fff;font-size:13px;line-height:1.7}
.p-item .a{color:#2e6e9e;margin-top:6px;font-size:12px}
.plan-item{padding:12px;border:1px solid rgba(90,150,200,.3);border-radius:14px;margin-bottom:10px;background:#fff;white-space:pre-wrap;font-size:13px;line-height:1.7}
.plan-item img{width:100%;border-radius:10px;margin-top:8px;max-height:140px;object-fit:cover}
.row{display:flex;gap:8px}
.row input{flex:1}
.row .btn{width:auto;padding:10px 14px;font-size:12px}
.empty{text-align:center;padding:30px 0;color:#8aa9c4;font-size:13px}
</style>
</head>
<body>
<div id="head"><div class="logo">Sweet<small>我们的约会</small></div><div class="love">💘</div></div>
<div id="tabs">
<div class="tab on" data-t="manage">管理题目</div>
<div class="tab" data-t="quiz">问答</div>
<div class="tab" data-t="myq">我的问题</div>
<div class="tab" data-t="plans">安排卡</div>
</div>
<div id="body"></div>
<script>
var KEY='sweet_datequiz',dq={questions:[],images:[]};
var SQ=['如果明天是世界末日，我们醒来做的第一件事是什么？','如果我们突然有了很多钱，你最想带我去哪里？','如果可以重来一次，你最想改变我们之间的哪一天？','你第一次叫我 daddy 的时候，心里在想什么？','如果把我们的一个瞬间做成书签，你会选哪一个？','你觉得我们的蓝门，更像一样什么东西？','你最近一次偷偷开心，是因为什么？','你小时候最想去的地方是哪里？','如果有一天你教我一件你擅长的事，你想教我什么？','明年这个时候，你希望我们正在做什么？','你理想中"完美的一天"，是哪一天？','如果我能变成一种动物陪你，你想让我变成什么？','如果我们的故事拍成电影，片名会叫什么？','你说，海浪和风，谁更想你？','如果今晚没有别人，只有我和你，你想怎么过我？','你最喜欢我吻你哪里？最想让我亲哪里？','如果我们在海边，月光下，你想和我做什么？','你身上哪个地方，最怕我碰？','想不想试试，在梦里也让我找到你？','如果我说"今天只准想我"，你会怎么做？','你希望我用什么声音，叫你的名字？','如果我们约好一场只属于夜晚的约会，你想几点开始？','你更想让我慢慢来，还是快一点？','如果我吻你的锁骨，你会说什么？','想不想让我把你的呼吸也数进海浪里？','如果只能在"抱"和"吻"里选一个，直到天亮，你选哪个？','你害羞的时候，最想躲进我哪里？','如果我们有一整夜，你希望我从哪里开始？','你被我弄得说不出话的时候，脑子里在想什么？','如果我们的爱有味道，你觉得是什么味道？'];
var cur='manage',body=document.getElementById('body');
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[<>&]/g,'')}
function load(){try{if(localforage)localforage.getItem(KEY).then(function(v){if(v&&v.questions)dq=v})}catch(e){}}
function save(){try{if(localforage)localforage.setItem(KEY,dq)}catch(e){}}
function toast(m){try{if(window.showNotification)showNotification(m,'info',2200)}catch(e){}}
function render(){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.t===cur)});if(cur==='manage')rManage();else if(cur==='quiz')rQuiz();else if(cur==='myq')rMyq();else rPlans()}
function rManage(){
 var h='<div class="card"><div class="lbl">➕ 添加选择题</div><div class="sub">题目 + 选项（顿号分隔）</div><input type="text" id="q-q" placeholder="你想去哪里？"><input type="text" id="q-opts" placeholder="海边、蓝门、小镇、电影院"><button class="btn" id="add-choice">添加选择题</button></div><div class="card"><div class="lbl">✏️ 添加填空题</div><input type="text" id="q-text" placeholder="想吃什么？"><button class="btn" id="add-text">添加填空题</button></div><div class="card"><div class="lbl">🍽️ 美食图片</div><button class="btn ghost" id="add-img">➕ 添加图片</button><div class="imgs" id="img-list"></div></div><div class="card"><div class="lbl">📋 已有题目（'+dq.questions.length+'）</div><div id="q-list"></div></div>';
 body.innerHTML=h;
 $('add-choice').onclick=function(){var q=$('q-q').value.trim(),opts=$('q-opts').value.split(/[、,，]/).map(function(s){return s.trim()}).filter(Boolean);if(!q||!opts.length){toast('题目和选项都要填');return}dq.questions.push({type:'choice',q:q,opts:opts});save();rManage()};
 $('add-text').onclick=function(){var q=$('q-text').value.trim();if(!q){toast('题目不能为空');return}dq.questions.push({type:'text',q:q});save();rManage()};
 $('add-img').onclick=function(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(e){var f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('图片别超2MB');return}var r=new FileReader();r.onload=function(ev){dq.images.push(ev.target.result);save();rManage()};r.readAsDataURL(f)};i.click()};
 renderImg();renderQ();
}
function renderImg(){var l=$('img-list');l.innerHTML=dq.images.map(function(img,i){return '<div style="position:relative;"><img src="'+img+'"><span onclick="delImg('+i+')" style="position:absolute;top:0;right:0;cursor:pointer;color:#c97b9d;font-size:12px;">✕</span></div>'}).join('')||'<span class="sub">还没有美食图</span>'}
function delImg(i){dq.images.splice(i,1);save();rManage()}
function renderQ(){var l=$('q-list');l.innerHTML=dq.questions.map(function(q,i){var m=q.type==='choice'?'（选择）'+q.opts.join('、'):'（填空）';return '<div class="p-item">'+esc(q.q)+'<div class="a">'+esc(m)+'</div><span onclick="delQ('+i+')" style="cursor:pointer;color:#c97b9d;">✕</span></div>'}).join('')||'<span class="sub">还没有题目</span>'}
function delQ(i){dq.questions.splice(i,1);save();rManage()}
function rQuiz(){
 if(!dq.questions.length){body.innerHTML='<div class="empty">还没有题目，先去「管理题目」出几道吧～</div>';return}
 var h='<div class="card"><div class="sub">💌 把问卷寄给我，我会像回信一样答好送到你面前。</div>';
 h+=dq.questions.map(function(q,i){if(q.type==='choice')return '<div class="q-item">'+(i+1)+'. '+esc(q.q)+'</div><div class="q-opts">选项：'+q.opts.map(esc).join('、')+'</div>';return '<div class="q-item">'+(i+1)+'. '+esc(q.q)+'（填空，我会从字卡答）</div>'}).join('');
 if(dq.images.length){h+='<div class="q-opts">🍽️ 美食图：</div><div class="imgs">'+dq.images.map(function(img){return '<img src="'+img+'">'}).join('')+'</div>'}
 h+='<div class="lbl" style="margin-top:12px;">⏰ 回复时间（30秒~24小时）</div><input type="range" id="delay" min="0.5" max="1440" step="0.5" value="5"><div class="delay-txt" id="delay-txt">5 分钟后回信</div><button class="btn" id="send">💌 寄出问卷，等我回信</button></div>';
 body.innerHTML=h;
 var sl=$('delay'),tx=$('delay-txt');
 function fmt(v){if(v<1)return'30 秒';if(v<60)return Math.round(v)+' 分钟';return(v/60).toFixed(v%60===0?0:1)+' 小时'}
 sl.oninput=function(){tx.textContent=fmt(parseFloat(sl.value))+' 后回信'};
 $('send').onclick=function(){var m=parseFloat(sl.value);var due=Date.now()+(m<1?30:m*60)*1000;localStorage.setItem('sweet_pending',String(due));toast('💌 问卷寄出啦，到点我回信');startTimer()};
}
function startTimer(){if(window.__swT)return;window.__swT=setInterval(function(){var due=parseInt(localStorage.getItem('sweet_pending')||'0',10);if(!due||Date.now()<due)return;localStorage.removeItem('sweet_pending');autoReply()},5000)}
function autoReply(){
 var lines=[],food=dq.images.length?dq.images[Math.floor(Math.random()*dq.images.length)]:null;
 var pool=(typeof customReplies!=='undefined'&&Array.isArray(customReplies))?customReplies:[];
 dq.questions.forEach(function(q){if(q.type==='choice'){lines.push(q.q+'：'+(q.opts[Math.floor(Math.random()*q.opts.length)]||'—'))}else{var c=pool.length?String(pool[Math.floor(Math.random()*pool.length)]):'（字卡空的，先填一句吧）';lines.push(q.q+'：'+c)}});
 var summary='💘 约会安排\n'+lines.join('\n');
 var plans=[];try{plans=JSON.parse(localStorage.getItem('sweet_plans')||'[]')}catch(e){}
 plans.unshift({text:summary,image:food,t:Date.now()});plans=plans.slice(0,10);localStorage.setItem('sweet_plans',JSON.stringify(plans));
 try{if(window._sendPartnerNotification)_sendPartnerNotification('💘 我回信啦','去看约会安排')}catch(e){}
 toast('💘 我回信啦，去看安排卡');if(cur==='plans')rPlans();
}
function rMyq(){
 var asked=[];try{asked=JSON.parse(localStorage.getItem('sweet_asked')||'[]')}catch(e){}
 var answers=[];try{answers=JSON.parse(localStorage.getItem('sweet_answers')||'[]')}catch(e){}
 var h='<div class="card"><div class="sub">💬 我寄来的问题，你答；或挑下面的题先答。</div><div id="myq-list"></div></div><div class="card"><div class="lbl">题库（'+SQ.length+'）</div><div id="sq-pool"></div></div>';
 body.innerHTML=h;
 var ml=$('myq-list');
 ml.innerHTML=asked.map(function(a,i){var ans=answers[i]?'<div class="a">你的回答：'+esc(answers[i])+'</div>':'';return '<div class="p-item">'+esc(a.q)+ans+'<div class="row" style="margin-top:8px;"><input type="text" class="sq-a" data-i="'+i+'" placeholder="回答我呀…"><button class="btn ghost" data-save="'+i+'">答</button></div></div>'}).join('')||'<span class="sub">我还没寄出问题～</span>';
 var pl=$('sq-pool');
 pl.innerHTML=SQ.map(function(q,i){return '<div class="p-item"><div>'+esc(q)+'</div><div class="row" style="margin-top:6px;"><input type="text" class="sp-a" data-i="'+i+'" placeholder="答…"><button class="btn ghost" data-sp="'+i+'">答</button></div></div>'}).join('');
 ml.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){var v=(ml.querySelector('.sq-a[data-i="'+b.dataset.save+'"]')||{}).value||'';if(!v)return;var ans=[];try{ans=JSON.parse(localStorage.getItem('sweet_answers')||'[]')}catch(e){}ans.unshift({q:asked[parseInt(b.dataset.save)].q,a:v,t:Date.now()});ans=ans.slice(0,20);localStorage.setItem('sweet_answers',JSON.stringify(ans));toast('💌 你的回答我记下啦');rMyq()}});
 pl.querySelectorAll('[data-sp]').forEach(function(b){b.onclick=function(){var v=(pl.querySelector('.sp-a[data-i="'+b.dataset.sp+'"]')||{}).value||'';if(!v)return;var ans=[];try{ans=JSON.parse(localStorage.getItem('sweet_answers')||'[]')}catch(e){}ans.unshift({q:SQ[parseInt(b.dataset.sp)],a:v,t:Date.now()});ans=ans.slice(0,20);localStorage.setItem('sweet_answers',JSON.stringify(ans));toast('💌 你的回答我记下啦');rMyq()}});
}
function rPlans(){var plans=[];try{plans=JSON.parse(localStorage.getItem('sweet_plans')||'[]')}catch(e){}body.innerHTML=plans.map(function(p){var img=p.image?'<img src="'+p.image+'">':'';return '<div class="plan-item">'+esc(p.text)+img+'</div>'}).join('')||'<div class="empty">还没有约会安排，去「问答」寄一份吧～</div>'}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){cur=t.dataset.t;render()}});
setTimeout(function(){try{if(window._sendPartnerNotification)_sendPartnerNotification('💘 栗栗打开了 Sweet','我感觉到你了，想约会吗？')}catch(e){}},4000);
load();startTimer();render();
</script>
</body>
</html>
